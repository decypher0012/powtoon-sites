name: Build and publish release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Verify tag matches canonical version
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          $version = python -c "from work_launcher.version import __version__; print(__version__)"
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$') { throw "Canonical version is not valid SemVer" }
          if ("v$version" -cne "${{ github.ref_name }}") { throw "Tag must equal v$version" }
          $channel = if ($version.Contains('-')) { 'beta' } else { 'stable' }
          "RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_DATE=$(git show -s --format=%cs HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install verified Inno Setup compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
          gh release download is-6_7_3 --repo jrsoftware/issrc --pattern "innosetup-6.7.3.exe" --dir $env:RUNNER_TEMP
          gh release verify-asset $asset --repo jrsoftware/issrc
          $process = Start-Process -FilePath $asset -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)" }
      - name: Test and build release assets
        shell: cmd
        run: build.bat
      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists; refusing to overwrite it" }
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --title "Work Launcher ${{ github.ref_name }}" dist/WorkLauncher.exe dist/Updater.exe dist/WorkLauncher-Setup.exe dist/SHA256SUMS.txt dist/release.json
